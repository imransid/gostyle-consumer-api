# Loki, single-binary, filesystem-backed.
#
# Sized for one Swarm node running one API: a few hundred MB of logs a day, one
# person querying at a time. There is no object store, no ring, no replication --
# adding those before there is a second node would be cost without benefit.
#
# Reachable only on the obs-net overlay as http://loki:3100. Nothing publishes
# it to the host, which is why auth_enabled is false: the only clients are
# Grafana and Alloy, both inside that network.

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: info
  # Alloy batches pushes; the default 4MB limit is occasionally tight when it
  # catches up after a restart.
  grpc_server_max_recv_msg_size: 8388608
  grpc_server_max_send_msg_size: 8388608

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    # v13 + tsdb is the current schema. The `from` date is in the past on
    # purpose: it must precede any data, and this is a fresh install.
    # Never edit this entry once data exists -- add a new one with a future
    # `from` date instead, or old chunks become unreadable.
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

storage_config:
  tsdb_shipper:
    active_index_directory: /loki/tsdb-index
    cache_location: /loki/tsdb-cache
  filesystem:
    directory: /loki/chunks

limits_config:
  # Disk is the constraint here, not ingest. 30 days of this API's volume is
  # comfortably under a gigabyte; raise it once you know the real number
  # (`docker exec <loki> du -sh /loki`).
  retention_period: 720h # 30d
  ingestion_rate_mb: 8
  ingestion_burst_size_mb: 16
  max_query_series: 5000
  # A container that has been down and comes back with old buffered lines is
  # normal; a week-old line is a bug somewhere. Reject those rather than let
  # them land out of order.
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  # Lets Grafana's "Log volume" / label-usage panels work.
  volume_enabled: true
  # request_id and friends ride along as structured metadata rather than as
  # labels, so this must stay on (it is the default for schema v13).
  allow_structured_metadata: true

compactor:
  working_directory: /loki/compactor
  delete_request_store: filesystem
  # Without this, retention_period above is documentation and nothing deletes.
  retention_enabled: true
  retention_delete_delay: 2h
  compaction_interval: 10m

ruler:
  storage:
    type: local
    local:
      directory: /loki/rules
  rule_path: /loki/rules-temp

# No phone-home.
analytics:
  reporting_enabled: false
