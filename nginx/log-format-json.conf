# JSON access-log format, so Loki can parse nginx lines into fields instead of
# treating them as prose.
#
# `log_format` is only valid in the http context, which is why this is a separate
# snippet installed to /etc/nginx/conf.d/ rather than living in the vhost.
# scripts/setup-nginx.sh installs it; the vhost's `access_log ... json_combined`
# will fail `nginx -t` if it is missing.
#
# escape=json (nginx >= 1.11.8) escapes quotes, backslashes and control
# characters in every variable, so a crafted User-Agent cannot break out of the
# object and forge a log entry.
#
# request_id is the ID Django generated and echoed on the response
# (config/observability.py). It is empty for anything nginx answered itself --
# a redirect, or a 502 with no upstream to ask.

# The query string, except where it carries personal data. `GET
# /api/v1/user/lookup?contact=` puts a member's email or phone in the URL, so
# its `query` is logged empty; `path` still records the call. $uri is already
# decoded and slash-merged, and the match ignores case and a trailing slash,
# so no spelling of the path Django would 404 logs the contact either.
#
# Access log only. On an upstream failure nginx's ERROR log prints the whole
# request line, query included, and no directive strips it. gunicorn's access
# log drops the same query in config/gunicorn_logging.py.
map $uri $loggable_args {
    ~*^/api/v1/user/lookup/?$  "";
    default                    $args;
}

log_format json_combined escape=json
  '{'
    '"src":"nginx.access",'
    '"ts":"$time_iso8601",'
    '"vhost":"$host",'
    '"remote_addr":"$remote_addr",'
    '"forwarded_for":"$http_x_forwarded_for",'
    '"method":"$request_method",'
    '"path":"$uri",'
    '"query":"$loggable_args",'
    '"status":$status,'
    '"bytes":$body_bytes_sent,'
    '"duration_s":$request_time,'
    '"upstream_time":"$upstream_response_time",'
    '"upstream_status":"$upstream_status",'
    '"referer":"$http_referer",'
    '"user_agent":"$http_user_agent",'
    '"request_id":"$sent_http_x_request_id"'
  '}';
