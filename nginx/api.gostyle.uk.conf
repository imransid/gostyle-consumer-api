# api.gostyle.uk — TLS terminator for the GoStyle consumer API.
#
# Runs as host nginx on the Swarm manager node, not as a container:
# `scripts/setup-nginx.sh` installs this file to
# /etc/nginx/sites-available/api.gostyle.uk and symlinks it into sites-enabled.
#
# The upstream is the port docker-compose.yml publishes (3850). The platform
# API next door owns 3849 and is not touched by this file.
#
# Static files are served by WhiteNoise inside gunicorn (see base.py STORAGES),
# so there is no `location /static/` here — everything proxies through.

upstream gostyle_consumer_api {
    server 127.0.0.1:3850;
    # Reuse connections; pairs with `proxy_http_version 1.1` + empty Connection
    # header below.
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.gostyle.uk;

    # Renewals must reach plain HTTP, so the ACME challenge is matched with ^~
    # to win over the redirect below.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.gostyle.uk;

    ssl_certificate     /etc/letsencrypt/live/api.gostyle.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.gostyle.uk/privkey.pem;

    # Mozilla "intermediate" profile, written out rather than included from
    # /etc/letsencrypt/options-ssl-nginx.conf — that file only exists when the
    # certbot *nginx plugin* is installed, and setup-nginx.sh uses webroot.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # No ssl_stapling: Let's Encrypt shut down its OCSP responders in 2025 and
    # its certificates no longer carry a responder URL, so nginx would ignore
    # the directive and log a warning on every reload.

    # HSTS, X-Content-Type-Options and the referrer policy are set by Django's
    # SecurityMiddleware (config/settings/production.py). Setting them here too
    # would send each header twice.

    access_log /var/log/nginx/api.gostyle.uk.access.log;
    error_log  /var/log/nginx/api.gostyle.uk.error.log;

    client_max_body_size 10m;

    gzip on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types application/json application/javascript text/css text/plain application/xml image/svg+xml;

    # The Django admin is reachable at https://api.gostyle.uk/admin/. To limit it
    # to the office/VPN egress IPs, uncomment this and copy the proxy_* lines
    # from `location /` into it (a location block inherits none of them).
    # location /admin/ {
    #     allow 203.0.113.10;
    #     deny all;
    #     proxy_pass http://gostyle_consumer_api;
    #     ...
    # }

    location / {
        proxy_pass http://gostyle_consumer_api;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # Appends $remote_addr to any client-supplied X-Forwarded-For, so the
        # last entry is always the address nginx actually saw. DRF's throttling
        # reads that last entry (NUM_PROXIES=1), which makes the login rate
        # limit unspoofable.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # SECURE_PROXY_SSL_HEADER keys off this one.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_redirect off;

        proxy_connect_timeout 5s;
        # gunicorn is started with --timeout 60; outlast it so a slow request
        # surfaces as the worker's own error rather than an nginx 504.
        proxy_read_timeout 65s;
        proxy_send_timeout 65s;
    }
}
