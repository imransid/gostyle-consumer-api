# logs.gostyle.uk — TLS terminator for Grafana.
#
# Same shape as api.gostyle.uk.conf: host nginx on the Swarm manager terminates
# TLS and proxies to the port the observability stack publishes (3851).
#
# Install it with the same script, pointed at this template:
#
#   sudo DOMAIN=logs.gostyle.uk UPSTREAM_PORT=3851 EMAIL=ops@gostyle.uk \
#        TEMPLATE=nginx/logs.gostyle.uk.conf ./scripts/setup-nginx.sh
#
# Create the A record first, and set GRAFANA_ROOT_URL=https://logs.gostyle.uk in
# observability.env so Grafana builds its links against this name.
#
# Grafana has its own login, so there is no basic auth here. Once this vhost is
# up, close the direct port so 3851 is not a way around TLS:
#
#   iptables -I DOCKER-USER -p tcp --dport 3851 ! -s 127.0.0.1 -j DROP

upstream gostyle_grafana {
    server 127.0.0.1:3851;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name logs.gostyle.uk;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name logs.gostyle.uk;

    ssl_certificate     /etc/letsencrypt/live/logs.gostyle.uk/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/logs.gostyle.uk/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Unlike the API vhost, nothing behind this one sets security headers, so
    # set them here. Grafana is a browser app for staff only.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    access_log /var/log/nginx/logs.gostyle.uk.access.log json_combined;
    error_log  /var/log/nginx/logs.gostyle.uk.error.log;

    # Grafana's dashboard-import and snapshot endpoints take sizeable bodies.
    client_max_body_size 32m;

    location / {
        proxy_pass http://gostyle_grafana;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;

        proxy_connect_timeout 5s;
        # Long-running LogQL queries over a wide time range outlast the default.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Grafana Live (the tail/stream view) is a WebSocket, which needs the Upgrade
    # dance. A location block inherits none of the proxy_* lines above, so they
    # are repeated.
    location /api/live/ {
        proxy_pass http://gostyle_grafana;

        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }
}
