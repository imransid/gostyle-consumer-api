version: "3.8"

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - consumer_redis_data:/data
    networks:
      - gostyle-net
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]
      restart_policy:
        condition: on-failure

  consumer-api:
    image: ghcr.io/entity-tech-solutions/gostyle-platform/gostyle-consumer-api:${TAG}
    command:
      - gunicorn
      - config.wsgi:application
      - --bind
      - 0.0.0.0:8000
      - --workers
      - "3"
      - --timeout
      - "60"
      - --access-logfile
      - "-"
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS}

      # Shared Postgres from the `gostyle` stack. Service name, not container name.
      DB_HOST: gostyle_postgres
      DB_PORT: "5432"
      DB_NAME: gostyle
      DB_USER: consumer_app
      DB_PASSWORD: ${DB_PASSWORD}
      DB_SCHEMA: consumer

      # Short name resolves because redis is in this same stack.
      REDIS_URL: redis://redis:6379/0

      OTP_SENDER: whatsapp
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN}
      WHATSAPP_TEMPLATE_NAME: ${WHATSAPP_TEMPLATE_NAME}
    ports:
      # Platform API is on 3849. Sit next to it.
      - "3850:8000"
    networks:
      - gostyle-net
    deploy:
      replicas: 2
      update_config:
        order: start-first
        failure_action: rollback
        delay: 10s
      rollback_config:
        order: start-first
      restart_policy:
        condition: on-failure
        max_attempts: 3

networks:
  gostyle-net:
    external: true
    name: gostyle_gostyle-net

volumes:
  consumer_redis_data: