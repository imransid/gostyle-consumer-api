version: "3.8"

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - consumer_redis_data:/data
    networks:
      - gostyle-net
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]
      restart_policy:
        condition: on-failure

  api:
    image: ${IMAGE:-gostyle-consumer-api:local}
    command:
      - gunicorn
      - config.wsgi:application
      - --bind
      - 0.0.0.0:8000
      - --workers
      - "3"
      - --timeout
      - "60"
      - --access-logfile
      - "-"
      # JSON, to match what Django emits (config/observability.py), so Loki
      # parses both with the same `| json` stage. %({X-Request-ID}o)s reads the
      # response header RequestIDMiddleware sets, which is how an access line
      # and the application logs for the same request find each other.
      # %(D)s is microseconds; %(B)s is the response body size.
      #
      # Client-supplied fields (User-Agent, Referer, X-Forwarded-For) are left
      # out on purpose: gunicorn does not escape values, so a quote in one would
      # produce an unparseable line. nginx logs all three, escaped properly
      # (nginx/log-format-json.conf).
      - --access-logformat
      - '{"level":"INFO","src":"gunicorn.access","method":"%(m)s","path":"%(U)s","query":"%(q)s","status":%(s)s,"duration_us":%(D)s,"bytes":"%(B)s","request_id":"%({X-Request-ID}o)s"}'
      # Blanks `query` for GET /api/v1/user/lookup, whose query is a member's
      # email or phone. nginx does the same in its own log.
      - --logger-class
      - config.gunicorn_logging.AccessLogger
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS}

      # Structured logs for Loki. "plain" is only for reading in a terminal.
      DJANGO_LOG_LEVEL: ${DJANGO_LOG_LEVEL:-INFO}
      DJANGO_LOG_FORMAT: ${DJANGO_LOG_FORMAT:-json}

      # Shared Postgres from the `gostyle` stack. Service name, not container name.
      DB_HOST: gostyle_postgres
      DB_PORT: "5432"
      DB_NAME: gostyle
      DB_USER: consumer_app
      DB_PASSWORD: ${DB_PASSWORD}
      DB_SCHEMA: consumer

      # booking-api's tables in the Django admin, read-only (apps/booking_data).
      # Empty leaves them out. Set it to gostyle_booking only after
      # scripts/sql/booking_admin_read_access.sql has run.
      BOOKING_DB_NAME: ${BOOKING_DB_NAME:-}

      # Short name resolves because redis is in this same stack.
      REDIS_URL: redis://redis:6379/0

      OTP_SENDER: smtp
      EMAIL_BACKEND: ${EMAIL_BACKEND:-django.core.mail.backends.smtp.EmailBackend}
      EMAIL_HOST: ${EMAIL_HOST}
      EMAIL_PORT: ${EMAIL_PORT:-587}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS:-True}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN}
      WHATSAPP_TEMPLATE_NAME: ${WHATSAPP_TEMPLATE_NAME}

      # Feature switches. Off unless stack.env turns them on.
      GROUP_BOOKING_V2: ${GROUP_BOOKING_V2:-False}
      SERIES_BOOKING_V1: ${SERIES_BOOKING_V1:-False}
      SINGLE_BOOKING_ACTIONS_V1: ${SINGLE_BOOKING_ACTIONS_V1:-False}
      SINGLE_LOOKUP_TIMEOUT: ${SINGLE_LOOKUP_TIMEOUT:-3}
      SELF_CHECK_IN_V1: ${SELF_CHECK_IN_V1:-False}

      # File uploads to S3. The keys live in stack.env, never in git.
      AWS_BUCKET_NAME: ${AWS_BUCKET_NAME:-}
      AWS_REGION: ${AWS_REGION:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}

      # Push notification service, a Compose container on gostyle-net as push-app.
      # The key lives in stack.env, never in git.
      PUSH_API_URL: ${PUSH_API_URL:-http://push-app:3351}
      PUSH_API_KEY: ${PUSH_API_KEY:-}
    ports:
      # Platform API is on 3849. Sit next to it.
      - "3850:8000"
    networks:
      - gostyle-net
    deploy:
      replicas: 2
      update_config:
        order: start-first
        failure_action: rollback
        delay: 10s
      rollback_config:
        order: start-first
      restart_policy:
        condition: on-failure
        max_attempts: 3

  # Internal gRPC auth service. Same image, different process.
  # Deliberately not published: add_insecure_port means no TLS, so this
  # must stay on the overlay network. Other stacks reach it at
  # gostyle-consumer_grpc:50051.
  grpc:
    image: ${IMAGE:-gostyle-consumer-api:local}
    command:
      - python
      - manage.py
      - grpcserver
      - --port
      - "50051"
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS}
      DJANGO_LOG_LEVEL: ${DJANGO_LOG_LEVEL:-INFO}
      DJANGO_LOG_FORMAT: ${DJANGO_LOG_FORMAT:-json}
      DB_HOST: gostyle_postgres
      DB_PORT: "5432"
      DB_NAME: gostyle
      DB_USER: consumer_app
      DB_PASSWORD: ${DB_PASSWORD}
      DB_SCHEMA: consumer
      REDIS_URL: redis://redis:6379/0
      # ConsumerDirectory (booking-api's reminder emails) refuses every call
      # until this is set, to the same value as booking-api's.
      INTERNAL_GRPC_KEY: ${INTERNAL_GRPC_KEY:-}
    networks:
      - gostyle-net
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        max_attempts: 3

networks:
  gostyle-net:
    external: true
    name: gostyle_gostyle-net

volumes:
  consumer_redis_data: