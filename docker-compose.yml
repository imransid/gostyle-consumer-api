version: "3.8"

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - consumer_redis_data:/data
    networks:
      - gostyle-net
    deploy:
      replicas: 1
      placement:
        constraints: [node.role == manager]
      restart_policy:
        condition: on-failure

  api:
    image: ${IMAGE:-gostyle-consumer-api:local}
    command:
      - gunicorn
      - config.wsgi:application
      - --bind
      - 0.0.0.0:8000
      - --workers
      - "3"
      - --timeout
      - "60"
      - --access-logfile
      - "-"
      # JSON, to match what Django emits (config/observability.py), so Loki
      # parses both with the same `| json` stage. %({X-Request-ID}o)s reads the
      # response header RequestIDMiddleware sets, which is how an access line
      # and the application logs for the same request find each other.
      # %(D)s is microseconds; %(B)s is the response body size.
      #
      # Client-supplied fields (User-Agent, Referer, X-Forwarded-For) are left
      # out on purpose: gunicorn does not escape values, so a quote in one would
      # produce an unparseable line. nginx logs all three, escaped properly
      # (nginx/log-format-json.conf).
      - --access-logformat
      - '{"level":"INFO","src":"gunicorn.access","method":"%(m)s","path":"%(U)s","query":"%(q)s","status":%(s)s,"duration_us":%(D)s,"bytes":"%(B)s","request_id":"%({X-Request-ID}o)s"}'
      # Blanks `query` for GET /api/v1/user/lookup, whose query is a member's
      # email or phone. nginx does the same in its own log.
      - --logger-class
      - config.gunicorn_logging.AccessLogger
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS}

      # Structured logs for Loki. "plain" is only for reading in a terminal.
      DJANGO_LOG_LEVEL: ${DJANGO_LOG_LEVEL:-INFO}
      DJANGO_LOG_FORMAT: ${DJANGO_LOG_FORMAT:-json}

      # Shared Postgres from the `gostyle` stack. Service name, not container name.
      DB_HOST: gostyle_postgres
      DB_PORT: "5432"
      DB_NAME: gostyle
      DB_USER: consumer_app
      DB_PASSWORD: ${DB_PASSWORD}
      DB_SCHEMA: consumer

      # booking-api's tables in the Django admin, read-only (apps/booking_data).
      # Empty leaves them out. Set it to gostyle_booking only after
      # scripts/sql/booking_admin_read_access.sql has run.
      BOOKING_DB_NAME: ${BOOKING_DB_NAME:-}

      # Short name resolves because redis is in this same stack.
      REDIS_URL: redis://redis:6379/0

      # Anything but "console" selects the real senders: WhatsApp for a phone,
      # email for an email.
      OTP_SENDER: live
      # Email goes over the SendGrid Mail Send API (no SMTP). Same names as
      # gostyle-platform and gostyle-booking-api, so one account and one
      # authenticated domain (gostyle.uk) serve all three. The sender must be on
      # that domain. The key lives in stack.env, never in git; unset, an email
      # code fails loudly rather than vanishing.
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      SENDGRID_FROM_EMAIL: ${SENDGRID_FROM_EMAIL:-noreply@gostyle.uk}
      SENDGRID_FROM_NAME: ${SENDGRID_FROM_NAME:-GoStyle}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN}
      WHATSAPP_TEMPLATE_NAME: ${WHATSAPP_TEMPLATE_NAME}

      # Feature switches. Off unless stack.env turns them on.
      GROUP_BOOKING_V2: ${GROUP_BOOKING_V2:-False}
      SERIES_BOOKING_V1: ${SERIES_BOOKING_V1:-False}
      SINGLE_BOOKING_ACTIONS_V1: ${SINGLE_BOOKING_ACTIONS_V1:-False}
      SINGLE_LOOKUP_TIMEOUT: ${SINGLE_LOOKUP_TIMEOUT:-3}
      SELF_CHECK_IN_V1: ${SELF_CHECK_IN_V1:-False}
      CHAIR_SCAN_V1: ${CHAIR_SCAN_V1:-False}
      GROUP_CHECK_IN_V1: ${GROUP_CHECK_IN_V1:-False}
      GROUP_SELF_CHECK_IN_V1: ${GROUP_SELF_CHECK_IN_V1:-False}
      GROUP_CANCEL_LANES_V1: ${GROUP_CANCEL_LANES_V1:-False}
      PACKAGES_LIVE_RULES_V1: ${PACKAGES_LIVE_RULES_V1:-False}
      PACKAGE_BOOKING_V1: ${PACKAGE_BOOKING_V1:-False}
      SLOT_MINUTES_AS_BOOKED_V1: ${SLOT_MINUTES_AS_BOOKED_V1:-False}
      PACKAGE_SAVING_AS_DISCOUNT_V1: ${PACKAGE_SAVING_AS_DISCOUNT_V1:-False}
      PACKAGE_END_TIME_FROM_QUOTE_V1: ${PACKAGE_END_TIME_FROM_QUOTE_V1:-False}
      DEVICE_SESSIONS_V1: ${DEVICE_SESSIONS_V1:-False}
      TWO_FACTOR_V1: ${TWO_FACTOR_V1:-False}
      # The authenticator secrets' key. The value lives in stack.env.
      TWO_FACTOR_ENCRYPTION_KEY: ${TWO_FACTOR_ENCRYPTION_KEY:-}
      # The Notification Center. Turn on only while the worker service runs.
      NOTIFICATION_CENTER_V1: ${NOTIFICATION_CENTER_V1:-False}
      # Email and SMS switches on the preferences screen, email from the center.
      NOTIFICATION_CHANNELS_V1: ${NOTIFICATION_CHANNELS_V1:-False}
      # The reminder time on the preferences screen.
      REMINDER_TIMING_V1: ${REMINDER_TIMING_V1:-False}

      # Sessions' location from the IP (docs/DEVICE_SESSIONS_SERVER.md).
      # Empty: location stays null.
      GEOIP_CITY_DB: ${GEOIP_CITY_DB:-}
      # The X-Proxy-Secret host nginx sends. The value lives in stack.env.
      PROXY_SECRET: ${PROXY_SECRET:-}

      # File uploads to S3. The keys live in stack.env, never in git.
      AWS_BUCKET_NAME: ${AWS_BUCKET_NAME:-}
      AWS_REGION: ${AWS_REGION:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}

      # Push notification service, a Compose container on gostyle-net as push-app.
      # The key lives in stack.env, never in git.
      PUSH_API_URL: ${PUSH_API_URL:-http://push-app:3351}
      PUSH_API_KEY: ${PUSH_API_KEY:-}
    ports:
      # Platform API is on 3849. Sit next to it.
      - "3850:8000"
    networks:
      - gostyle-net
    deploy:
      replicas: 2
      update_config:
        order: start-first
        failure_action: rollback
        delay: 10s
      rollback_config:
        order: start-first
      restart_policy:
        condition: on-failure
        max_attempts: 3

  # Internal gRPC auth service. Same image, different process.
  # Deliberately not published: add_insecure_port means no TLS, so this
  # must stay on the overlay network. Other stacks reach it at
  # gostyle-consumer_grpc:50051.
  grpc:
    image: ${IMAGE:-gostyle-consumer-api:local}
    command:
      - python
      - manage.py
      - grpcserver
      - --port
      - "50051"
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS}
      DJANGO_LOG_LEVEL: ${DJANGO_LOG_LEVEL:-INFO}
      DJANGO_LOG_FORMAT: ${DJANGO_LOG_FORMAT:-json}
      DB_HOST: gostyle_postgres
      DB_PORT: "5432"
      DB_NAME: gostyle
      DB_USER: consumer_app
      DB_PASSWORD: ${DB_PASSWORD}
      DB_SCHEMA: consumer
      REDIS_URL: redis://redis:6379/0
      # ConsumerDirectory (booking-api's reminder emails) refuses every call
      # until this is set, to the same value as booking-api's.
      INTERNAL_GRPC_KEY: ${INTERNAL_GRPC_KEY:-}
      # VerifyConsumer refuses a signed-out device's token. Same value as api's.
      DEVICE_SESSIONS_V1: ${DEVICE_SESSIONS_V1:-False}
      # Whether a notification booking-api hands over is also emailed. Same
      # value as api's.
      NOTIFICATION_CHANNELS_V1: ${NOTIFICATION_CHANNELS_V1:-False}
    networks:
      - gostyle-net
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        max_attempts: 3

  # Sends the Notification Center's queued pushes (apps/notifications).
  # Same image, different process. Safe at more than one replica: rows are
  # claimed with SKIP LOCKED. Not published; it only calls out.
  worker:
    image: ${IMAGE:-gostyle-consumer-api:local}
    command:
      - python
      - manage.py
      - notification_worker
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS}
      DJANGO_LOG_LEVEL: ${DJANGO_LOG_LEVEL:-INFO}
      DJANGO_LOG_FORMAT: ${DJANGO_LOG_FORMAT:-json}
      DB_HOST: gostyle_postgres
      DB_PORT: "5432"
      DB_NAME: gostyle
      DB_USER: consumer_app
      DB_PASSWORD: ${DB_PASSWORD}
      DB_SCHEMA: consumer
      REDIS_URL: redis://redis:6379/0
      PUSH_API_URL: ${PUSH_API_URL:-http://push-app:3351}
      PUSH_API_KEY: ${PUSH_API_KEY:-}
    networks:
      - gostyle-net
    deploy:
      replicas: 1
      update_config:
        # Stop the old one first: two at once is safe, but one is enough.
        order: stop-first
      restart_policy:
        condition: on-failure

networks:
  gostyle-net:
    external: true
    name: gostyle_gostyle-net

volumes:
  consumer_redis_data: